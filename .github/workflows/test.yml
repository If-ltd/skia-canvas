name: Build Windows Skia validation artifact
on:
  push:
    branches: ['codex/qa-skia-backend-order-*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: git config --system core.longpaths true
      - run: make optimized
      - run: node tests/windows-offscreen.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: skia-windows-order-qa
          path: lib/skia.node
          if-no-files-found: error
          retention-days: 2
