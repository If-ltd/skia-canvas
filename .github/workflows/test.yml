name: Test Moda Windows x64
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags-ignore: ['v*-moda.*']
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
      - run: git config --system core.longpaths true
      - run: make optimized
      - run: npm test
      - run: node tests/windows-offscreen.cjs
